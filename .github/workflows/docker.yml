name: CI and Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for the runner first and prove the image boots: a fresh /config volume gets a database and key, and the app answers.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: filtarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker volume create filtarr-ci
          docker run -d --name filtarr-ci -p 3000:3000 -v filtarr-ci:/config filtarr:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/rules)" = 401
          docker exec filtarr-ci ls -l /config/filtarr.db /config/filtarr.db.key
          # Restart on the same volume: the existing database and key must load again.
          docker restart filtarr-ci
          sleep 5
          curl -fsS -o /dev/null http://localhost:3000/
          docker logs filtarr-ci
          # Unraid runs containers as 99:100: the entrypoint must take over the existing config and drop root.
          docker rm -f filtarr-ci
          docker run -d --name filtarr-ci -p 3000:3000 -e PUID=99 -e PGID=100 -v filtarr-ci:/config filtarr:ci
          sleep 5
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(docker exec filtarr-ci stat -c %u:%g /config/filtarr.db)" = 99:100
          docker exec filtarr-ci grep -qE '^Uid:\s+99\s' /proc/1/status
      - name: Container logs on failure
        if: failure()
        run: docker logs filtarr-ci || true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
